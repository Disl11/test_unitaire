name: Test Flask App


on :
	push:
		branches:[main]
	pull_request:
		branches:[main]

	jobs:
		test:
			runs-on: ubuntu-latest

			steps:
		# étape 1: récupérer le code 
			- name:  Checkout code 
			  uses: actions/checkout@v3

		# etape 2 builder l'image docker
			- name: Builde Docker Image 
			  run docker build -t web .

		# étape 3 : Lancer les tests dans le container
			- name: Run Test
			  run: docker run web pytest -v