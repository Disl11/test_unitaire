name: Test Flask App

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            # étape 1 : récupérer le code
            - name: Checkout code
              uses: actions/checkout@v3

            # étape 2 : builder l'image docker
            - name: Build Docker Image
              run: docker build -t web .

            # étape 3 : lancer les tests dans le container
            - name: Run Test
              run: docker run web pytest -v
